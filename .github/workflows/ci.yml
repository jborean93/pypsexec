name: Test pypsexec
on:
  push:
    branches:
    - master
    tags:
    - 'v*'
    paths-ignore:
    - CHANGELOG.md
    - LICENSE
    - README.md

  pull_request:
    branches:
    - master
    paths-ignore:
    - CHANGELOG.md
    - LICENSE
    - README.md

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Validate release version
      if: github.ref_type == 'tag'
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python - <<'PY'
        import os
        import tomllib
        from pathlib import Path

        version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        expected_tag = f"v{version}"
        actual_tag = os.environ["RELEASE_TAG"]
        if actual_tag != expected_tag:
            raise SystemExit(f"Release tag {actual_tag!r} must match {expected_tag!r}")
        print(f"Validated release version: {version}")
        PY

    - name: Build pypsexec
      run: |
        python -m pip install build
        python -m build

    - name: Upload built pypsexec
      uses: actions/upload-artifact@v4
      with:
        name: artifact
        path: ./dist/*

  test:
    name: test
    needs:
    - build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python-version:
        - 3.9
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        python-arch:
        - x86
        - x64

        exclude:
        - os: ubuntu-latest
          python-arch: x86

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.python-arch }}

    - uses: actions/download-artifact@v5
      with:
        name: artifact
        path: ./dist

    - name: Extract OS name
      shell: bash
      run: |
        echo NAME=$( echo '${{ matrix.os }}' | tr '-' ' ' | awk '{print $1}' )
        echo "${NAME}"
        echo "name=${NAME}" >> $GITHUB_OUTPUT
      id: os

    - name: Test
      shell: bash
      run: |
        if [ "$(expr substr $(uname -s) 1 5)" == "MINGW" ]; then
            build_helpers/run-ci.sh
        else
            sudo -E build_helpers/run-ci.sh
        fi
      env:
        PYTEST_ADDOPTS: --color=yes

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Unit Test Results (${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.python-arch }})
        path: ./junit/test-results.xml

    - name: Upload Coverage Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Coverage Results (${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.python-arch }})
        path: ./coverage.xml

    - name: Upload Coverage to codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: ${{ steps.os.outputs.name }},py${{ matrix.python-version }},${{ matrix.python-arch }}
        token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Create GitHub release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
    - build
    - test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v5
      with:
        name: artifact
        path: ./dist

    - name: Attach packages to GitHub release draft
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(./dist/*.whl)
        archives=(./dist/*.tar.gz)
        if [[ ${#wheels[@]} -ne 1 || ${#archives[@]} -ne 1 ]]; then
          echo "Expected exactly one wheel and one source archive" >&2
          exit 1
        fi
        if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
          if [[ "$is_draft" != "true" ]]; then
            echo "Refusing to overwrite assets of a published release" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${wheels[0]}" "${archives[0]}" --clobber
        else
          gh release create "$RELEASE_TAG" "${wheels[0]}" "${archives[0]}" \
            --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
        fi
